name: Check WhatsApp channel without sending messages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/whatsapp_diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_PRIVATE_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
      - name: Read sanitized WhatsApp diagnostics
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          docker exec -i intercity-backend node <<'JS'
          const {PrismaClient}=require('@prisma/client');const db=new PrismaClient();
          (async()=>{const admins=await db.user.findMany({where:{role:'ADMIN',blockedAt:null},select:{phone:true}});
          const failures=await db.adminAttention.count({where:{category:'whatsapp-send',createdAt:{gte:new Date(Date.now()-86400000)}}});
          console.log('Admin phone formats:',admins.map(x=>{const d=x.phone.replace(/\D/g,'');return /^7\d{10}$/.test(d)?'international':/^8\d{10}$/.test(d)?'national':/^\d{10}$/.test(d)?'local':'other'}),'recent gateway failures:',failures);
          const res=await fetch('http://whatsapp:3000/api/sessions/default',{headers:{'X-Api-Key':process.env.WHATSAPP_CHANNEL_KEY}});const j=await res.json();console.log('Channel:',j.status,'engine:',j.engine?.engine||j.config?.engine||'unknown');})().finally(()=>db.$disconnect());
          JS
          REMOTE
