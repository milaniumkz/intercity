name: Probe VTB sandbox bank form
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vtb_card_capability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_PRIVATE_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
      - name: Register an unpaid sandbox form
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "docker exec -i -e PROBE_RUN=$GITHUB_RUN_ID intercity-backend node" > "$RUNNER_TEMP/probe.json" <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{randomUUID}=require('node:crypto');
          const file='/app/technical-data/vtb-capability-'+process.env.PROBE_RUN+'.json';
          const auth={userName:process.env.VTB_SANDBOX_USER_NAME,password:process.env.VTB_SANDBOX_PASSWORD||Buffer.from(process.env.VTB_SANDBOX_PASSWORD_B64||'','base64').toString()};
          async function call(method,values){const body=new URLSearchParams({...auth,...values});if(values.features){body.delete('features');for(const v of values.features)body.append('features',v);}
          const r=await fetch('https://vtbkz.rbsuat.com/payment/rest/'+method,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body,signal:AbortSignal.timeout(20000)});assert(r.ok);return r.json();}
          (async()=>{assert.equal(process.env.VTB_SANDBOX_ENABLED,'true');const orderNumber=randomUUID(),clientId=randomUUID();
          const r=await call('register.do',{orderNumber,clientId,amount:'100',currency:'398',returnUrl:'https://intercity.89-207-255-27.sslip.io/'});assert.equal(String(r.errorCode??0),'0');
          fs.writeFileSync(file,JSON.stringify({bankId:r.orderId,orderNumber}),{mode:0o600});console.log(JSON.stringify({paymentUrl:r.formUrl}));
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          JS
      - name: Inspect bank form embedding
        run: |
          npm install --prefix "$RUNNER_TEMP/bank" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.56.1
          export BANK_BROWSER_MODULE="$RUNNER_TEMP/bank/node_modules/playwright"
          export BANK_BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          node <<'JS'
          const fs=require('node:fs'),{chromium}=require(process.env.BANK_BROWSER_MODULE);
          (async()=>{const meta=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/probe.json','utf8'));const b=await chromium.launch({headless:true,executablePath:process.env.BANK_BROWSER_BIN,args:['--no-sandbox']});
          try{const p=await b.newPage({locale:'ru-RU',viewport:{width:1200,height:950}});await p.route('**/flutter_bootstrap.js',r=>r.abort());
          await p.goto('https://intercity.89-207-255-27.sslip.io/',{waitUntil:'domcontentloaded'});await p.setContent('<iframe id="bank-frame" style="width:1100px;height:900px;border:0"></iframe>');
          let security={};p.on('response',async r=>{if(r.url()===meta.paymentUrl){const h=await r.allHeaders();security={xFrameOptions:h['x-frame-options']||null,frameAncestors:(h['content-security-policy']||'').match(/frame-ancestors[^;]*/)?.[0]||null};}});
          await p.locator('#bank-frame').evaluate((el,url)=>el.src=url,meta.paymentUrl);
          let embedded=false;try{await p.frameLocator('#bank-frame').locator('#new-card-pan').waitFor({state:'visible',timeout:30000});embedded=true;}catch{}
          console.log(JSON.stringify({bankIframeCardFormVisible:embedded,...security}));
          }finally{await b.close();}})().catch(e=>{console.error(e.message);process.exitCode=1;});
          JS
      - name: Decline the unpaid order and remove fixture
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "docker exec -i -e PROBE_RUN=$GITHUB_RUN_ID intercity-backend node"  <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{randomUUID}=require('node:crypto');
          const file='/app/technical-data/vtb-capability-'+process.env.PROBE_RUN+'.json';
          const auth={userName:process.env.VTB_SANDBOX_USER_NAME,password:process.env.VTB_SANDBOX_PASSWORD||Buffer.from(process.env.VTB_SANDBOX_PASSWORD_B64||'','base64').toString()};
          async function call(method,values){const body=new URLSearchParams({...auth,...values});if(values.features){body.delete('features');for(const v of values.features)body.append('features',v);}
          const r=await fetch('https://vtbkz.rbsuat.com/payment/rest/'+method,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body,signal:AbortSignal.timeout(20000)});assert(r.ok);return r.json();}
          (async()=>{if(!fs.existsSync(file))return;const m=JSON.parse(fs.readFileSync(file,'utf8'));const r=await call('decline.do',{orderId:m.bankId,language:'ru'});const s=await call('getOrderStatusExtended.do',{orderId:m.bankId});
          console.log(JSON.stringify({unpaidDeclineCode:r.errorCode??0,unpaidBankStatus:s.orderStatus,paidAmount:s.paymentAmountInfo?.depositedAmount??0}));assert.equal(String(r.errorCode??0),'0');assert.equal(Number(s.orderStatus),6);fs.unlinkSync(file);
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          JS
