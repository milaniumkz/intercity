name: Provision VTB sandbox encryption key

on:
  push:
    branches: [main]
    paths: [.github/workflows/vtb_sandbox_key.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_PRIVATE_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
      - name: Verify current release, back up, and provision server-only key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          app=/opt/intercity
          current="$(readlink -f "$app/current")"
          expected=6e7e5b1005af825fce8405b4c26ea37628e25ba3
          [[ "$(basename "$current")" == "$expected" ]] || { echo 'Current production release changed; refusing key provisioning'; exit 1; }
          test -f "$current/.release-manifest.json"
          test -f "$app/shared/.env"
          backup="$app/backups/$(date -u +%Y%m%d-%H%M%S)-vtb-sandbox-key"
          mkdir -p "$backup"
          cp "$app/shared/.env" "$backup/env.backup"
          cp "$current/.release-manifest.json" "$backup/release-manifest.json"
          docker exec intercity-postgres sh -c 'exec pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$backup/postgres.sql"
          grep -q 'PostgreSQL database dump complete' "$backup/postgres.sql"
          tar -C "$app/shared" -czf "$backup/uploads.tar.gz" uploads
          tar -tzf "$backup/uploads.tar.gz" >/dev/null
          keydir="$app/shared/vtb-sandbox-secrets"
          mkdir -p "$keydir"
          chmod 700 "$keydir"
          if [[ -f "$keydir/private.pem" ]]; then
            cp "$keydir/private.pem" "$backup/vtb-private.pem"
          else
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$keydir/private.pem.tmp" 2>/dev/null
            chmod 600 "$keydir/private.pem.tmp"
            mv "$keydir/private.pem.tmp" "$keydir/private.pem"
          fi
          chmod 600 "$keydir/private.pem"
          echo "Verified production revision and backup: $backup"
          echo 'VTB_SANDBOX_PUBLIC_KEY_BEGIN'
          openssl pkey -in "$keydir/private.pem" -pubout
          echo 'VTB_SANDBOX_PUBLIC_KEY_END'
          REMOTE
