name: Verify deployed VTB and authentication

on:
  push:
    branches: [main]
    paths: [.github/workflows/vtb_sandbox_live_verify.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_PRIVATE_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
      - name: Check deployed sandbox without changing balances or orders
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          expected=fdaa4b6ebfcd2012bda8ed0c19b7efa24c341037
          for ((attempt=0; attempt<60; attempt++)); do
            current="$(readlink -f /opt/intercity/current)"
            if [[ "$(basename "$current")" == "$expected" ]]; then break; fi
            sleep 10
          done
          current="$(readlink -f /opt/intercity/current)"
          [[ "$(basename "$current")" == "$expected" ]] || { echo 'Expected VTB release is not active'; exit 1; }
          docker exec -i intercity-backend node <<'JS'
          const assert = require('node:assert/strict');
          const { PrismaClient } = require('@prisma/client');
          const { VtbSandboxGateway, verifiedVtbSandboxState } = require('./dist/src/payments/vtb-sandbox-gateway');
          const p = new PrismaClient();
          (async () => {
            assert.equal(process.env.VTB_SANDBOX_ENABLED, 'true', 'Sandbox flag');
            const gateway = new VtbSandboxGateway({
              userName: process.env.VTB_SANDBOX_USER_NAME || '',
              password: process.env.VTB_SANDBOX_PASSWORD || Buffer.from(process.env.VTB_SANDBOX_PASSWORD_B64 || '', 'base64').toString('utf8'),
            });
            assert.equal(gateway.configured, true, 'Sandbox credentials');
            // Read only: the official test-card operation completed during verification.
            const response = await gateway.status('4f3492e8-4ec6-7d91-bc02-741c00e88b48');
            const verified = verifiedVtbSandboxState(response, {
              orderNumber: '442dde54-853f-49bd-9f8c-47a449b2e5cf', bankAmountMinor: 70000,
            });
            assert.equal(verified, 'SUCCEEDED', 'Bank status, saved amount, currency and order');
            await p.vtbSandboxPayment.count();
            console.log(JSON.stringify({releaseVerified:true, sandboxEnabled:true, credentialsVerified:true, tableReady:true,
              appCurrency:'RUB', appAmount:100, conversionRate:7, bankCurrency:response.currency,
              bankAmountMinor:response.amount, verifiedStatus:verified, financialWrites:false}));
          })().catch(() => { console.error('Deployed VTB sandbox verification failed; no credentials printed'); process.exitCode=1; })
            .finally(() => p.$disconnect());
          JS
          REMOTE
      - name: Verify public API, callback acknowledgement, versions and bank return
        run: |
          python3 <<'PY'
          import urllib.request,urllib.error,json,concurrent.futures
          sha='fdaa4b6ebfcd2012bda8ed0c19b7efa24c341037'
          api='https://api.intercity.89-207-255-27.sslip.io'
          web='https://intercity.89-207-255-27.sslip.io'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args):return None
          opener=urllib.request.build_opener(NoRedirect)
          checks=[
           ('webVersion',web+'/version.json',None,200),
           ('adminVersion','https://admin.intercity.89-207-255-27.sslip.io/version.json',None,200),
           ('health',api+'/health',None,200),
           ('walletAuth',api+'/api/wallet/vtb/sandbox',None,401),
           ('createAuth',api+'/api/wallet/vtb/sandbox/payments',{'amount':100,'currency':'RUB'},401),
           ('callback',api+'/api/payments/vtb/sandbox/callback',{'orderNumber':'442dde54-853f-49bd-9f8c-47a449b2e5cf'},200),
           ('return',api+'/api/payments/vtb/sandbox/return?paymentId=442dde54-853f-49bd-9f8c-47a449b2e5cf&redirect=https://example.com',None,302)]
          def probe(item):
           name,url,body,expected=item
           req=urllib.request.Request(url,data=None if body is None else json.dumps(body).encode(),headers={'Content-Type':'application/json'})
           try:r=opener.open(req,timeout=20)
           except urllib.error.HTTPError as e:r=e
           data=r.read(1200).decode(); status=r.code
           assert status==expected,(name,status,data)
           if name.endswith('Version'):assert json.loads(data)['commit']==sha
           if name=='callback':assert json.loads(data).get('ignored') is True
           if name=='return':assert r.headers.get('Location','').startswith(web+'/#/driver/wallet?vtbSandboxPaymentId='),r.headers
           return {'name':name,'status':status,'passed':True,'location':r.headers.get('Location') if name=='return' else None}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as p:
           for result in p.map(probe,checks):print(json.dumps(result))
          
          PY
      - name: Verify mobile web starts in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/intercity-vtb-browser" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.56.1
          browser_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$browser_bin" ]]; then
            "$RUNNER_TEMP/intercity-vtb-browser/node_modules/.bin/playwright" install --with-deps chromium
          fi
          export INTERCITY_PLAYWRIGHT_MODULE="$RUNNER_TEMP/intercity-vtb-browser/node_modules/playwright"
          export INTERCITY_BROWSER_EXECUTABLE="$browser_bin"
          node <<'JS'
          const assert = require('node:assert/strict');
          const { chromium } = require(process.env.INTERCITY_PLAYWRIGHT_MODULE);
          (async () => {
            const browser = await chromium.launch({headless:true,
              executablePath:process.env.INTERCITY_BROWSER_EXECUTABLE || undefined, args:['--no-sandbox']});
            try {
              const page = await browser.newPage({locale:'ru-RU', viewport:{width:393,height:852}});
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              const response = await page.goto('https://intercity.89-207-255-27.sslip.io/#/login',
                {waitUntil:'domcontentloaded',timeout:60000});
              assert.equal(response.status(),200);
              await page.waitForSelector('flutter-view',{timeout:45000});
              await page.waitForTimeout(3000);
              assert.deepEqual(errors,[]);
              console.log(JSON.stringify({webStarted:true,locale:'ru-RU',flutterViews:1,pageErrors:0}));
            } finally { await browser.close(); }
          })().catch(error => { console.error(error.message);process.exitCode=1; });
          JS
      - name: Verify persistent login using temporary accounts and remove them
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(basename "$(readlink -f /opt/intercity/current)")" == "fdaa4b6ebfcd2012bda8ed0c19b7efa24c341037" ]] || { echo 'Authentication release changed'; exit 1; }
          docker exec -i intercity-backend node <<'JS'
          const assert = require('node:assert/strict');
          const {randomUUID,randomInt,randomBytes} = require('node:crypto');
          const bcrypt = require('bcrypt');
          const {PrismaClient} = require('@prisma/client');
          const {JwtService} = require('@nestjs/jwt');
          const {ConfigService} = require('@nestjs/config');
          const {AuthService} = require('./dist/src/auth/auth.service');
          const db = new PrismaClient(), jwt = new JwtService(), ids = [];
          const auth = new AuthService(db,jwt,{},new ConfigService(),undefined);
          const password = randomBytes(24).toString('base64url');
          async function makeUser(role) {
            const user = await db.user.create({data:{
              phone:'+7000'+String(randomInt(10000000)).padStart(7,'0'),
              name:'Temporary authentication verification',role,
              password:await bcrypt.hash(password,4),refCode:randomUUID(),refLink:'',
            }});
            ids.push(user.id);
            return user;
          }
          async function request(path,body,expected=201) {
            const response = await fetch('http://127.0.0.1:8080/api'+path,{
              method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),
              signal:AbortSignal.timeout(15000),
            });
            assert.equal(response.status,expected,'Authentication HTTP status');
            return response.json();
          }
          function verify(pair,user) {
            assert.equal(jwt.verify(pair.accessToken,{secret:process.env.JWT_SECRET}).sub,user.id);
            assert.equal(jwt.verify(pair.refreshToken,{secret:process.env.JWT_REFRESH_SECRET}).sub,user.id);
          }
          (async()=>{
            try {
              const driver=await makeUser('DRIVER'), passenger=await makeUser('PASSENGER');
              const login=user=>request('/auth/login',{phone:user.phone,password});
              const first=await login(driver), second=await login(driver), separate=await login(passenger);
              const expired=jwt.sign({sub:driver.id,phone:driver.phone,role:driver.role,ver:driver.authVersion},
                {secret:process.env.JWT_SECRET,expiresIn:-1});
              const expiredResponse=await fetch('http://127.0.0.1:8080/api/me',{
                headers:{Authorization:'Bearer '+expired},signal:AbortSignal.timeout(15000)});
              assert.equal(expiredResponse.status,401,'Expired access must be rejected');
              let a=await request('/auth/refresh',{refreshToken:first.refreshToken});
              let b=await request('/auth/refresh',{refreshToken:second.refreshToken});
              for(let i=0;i<20;i++) {
                a=await auth.refreshToken(a.refreshToken);
                b=await auth.refreshToken(b.refreshToken);
                verify(a,driver);verify(b,driver);
              }
              const raced=await Promise.all(Array.from({length:20},()=>auth.refreshToken(a.refreshToken)));
              assert.equal(new Set(raced.map(x=>x.refreshToken)).size,1,'Concurrent replacement');
              for(const pair of raced) verify(pair,driver);
              assert.equal(await db.refreshToken.count({where:{userId:driver.id,rotatedAt:null}}),2);
              await db.refreshToken.update({where:{token:a.refreshToken},data:{rotatedAt:new Date(Date.now()-31000)}});
              await request('/auth/refresh',{refreshToken:a.refreshToken},401);
              verify(await request('/auth/refresh',{refreshToken:b.refreshToken}),driver);
              verify(await request('/auth/refresh',{refreshToken:separate.refreshToken}),passenger);
              console.log(JSON.stringify({authHttpVerified:true,expiredAccessRejected:true,automaticRefresh:true,
                devicesKept:2,independentAccounts:2,rotationsPerPhone:20,concurrentRefreshes:20,
                obsoleteTokenRejected:true,financialWrites:false}));
            } finally {
              if(ids.length) {
                await db.refreshToken.deleteMany({where:{userId:{in:ids}}});
                const removed=await db.user.deleteMany({where:{id:{in:ids}}});
                assert.equal(removed.count,ids.length,'Temporary accounts cleanup');
                console.log(JSON.stringify({temporaryAuthAccountsRemoved:removed.count}));
              }
            }
          })().catch(()=>{console.error('Live authentication verification failed; no tokens or passwords printed');process.exitCode=1;})
            .finally(()=>db.$disconnect());
          
          JS
          REMOTE
