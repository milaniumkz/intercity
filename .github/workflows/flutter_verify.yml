name: Flutter Verify

on:
  pull_request:
    paths:
      - '.github/workflows/flutter_verify.yml'
      - 'apps/mobile_flutter/**'
      - 'apps/admin_web/**'
      - 'packages/intercity_shared/**'
      - 'scripts/**'
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/flutter_verify.yml'
      - 'apps/mobile_flutter/**'
      - 'apps/admin_web/**'
      - 'packages/intercity_shared/**'
      - 'scripts/**'

jobs:
  flutter-verify:
    name: Analyze, test, and web-build both apps
    runs-on: ${{ github.event_name == 'push' && fromJSON('["milanium-mac-arm64", "repo-intercity"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        if: github.event_name != 'push'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.1'
          cache: true

      - name: Select installed Mac Flutter
        if: github.event_name == 'push'
        run: |
          echo /Volumes/PD1000/job/flutter/bin >> "$GITHUB_PATH"
          /Volumes/PD1000/job/flutter/bin/flutter --version --machine | python3 -c 'import json,sys; assert json.load(sys.stdin)["frameworkVersion"] == "3.41.1"'

      - name: Print Flutter version
        run: flutter --version

      - name: Verify Flutter apps
        env:
          FLUTTER_BIN: flutter
          RUN_MACOS_SMOKE: 0
        run: bash scripts/verify_flutter_apps.sh

  mobile-smoke-macos:
    name: macOS smoke test for mobile app
    runs-on: ${{ github.event_name == 'push' && fromJSON('["milanium-mac-arm64", "repo-intercity"]') || fromJSON('["macos-latest"]') }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        if: github.event_name != 'push'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.1'
          cache: true

      - name: Select installed Mac Flutter
        if: github.event_name == 'push'
        run: |
          echo /Volumes/PD1000/job/flutter/bin >> "$GITHUB_PATH"
          /Volumes/PD1000/job/flutter/bin/flutter --version --machine | python3 -c 'import json,sys; assert json.load(sys.stdin)["frameworkVersion"] == "3.41.1"'

      - name: Enable macOS desktop
        if: github.event_name != 'push'
        run: flutter config --enable-macos-desktop

      - name: Run mobile macOS smoke test
        env:
          FLUTTER_BIN: flutter
          VERIFY_ADMIN: 0
          RUN_WEB_BUILDS: 0
          RUN_MACOS_SMOKE: 1
          RUN_UNIT_TESTS: 0
        run: bash scripts/verify_flutter_apps.sh
