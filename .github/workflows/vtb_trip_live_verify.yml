name: Verify VTB passenger trips
on:
  workflow_run:
    workflows: [Deploy VPS]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_sha == '60882cae8f84e82f64d8e9a4b026422799af9f1a' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_PRIVATE_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
      - name: Create an isolated accepted RUB trip
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s -- "$GITHUB_RUN_ID" > "$RUNNER_TEMP/trip-probe.json" <<'REMOTE'
          set -euo pipefail
          [[ "$(basename "$(readlink -f /opt/intercity/current)")" == "60882cae8f84e82f64d8e9a4b026422799af9f1a" ]] || { echo 'Expected VTB trip release is not active' >&2; exit 1; }
          docker exec -i -e VTB_TRIP_PROBE_RUN="$1" intercity-backend node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),{randomUUID}=require('node:crypto');
          const {PrismaClient}=require('@prisma/client');
          const {VtbTripPaymentsService,vtbTripBankState}=require('./dist/src/payments/vtb-trip-payments.service');
          const {CardPaymentsService}=require('./dist/src/payments/card-payments.service');
          const {OrdersService}=require('./dist/src/orders/orders.service');
          const {DriverService}=require('./dist/src/driver/driver.service');
          const db=new PrismaClient(),run=process.env.VTB_TRIP_PROBE_RUN;
          assert.match(run,/^[0-9]+$/);
          const file=path.join(process.env.TECH_STORAGE_DIR||'/app/technical-data','vtb-trip-live-'+run+'.json');
          const realtime={publish(){}},push={sendToUser:async()=>{},sendOrderStatusToPassenger:async()=>{}};
          const vtb=new VtbTripPaymentsService(db,realtime),cards=new CardPaymentsService(db,realtime,push,vtb),orders=new OrdersService(db,{}, {},realtime,push,cards);
          const drivers=new DriverService(db,{},realtime,push,{},null,undefined,undefined,cards);
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          async function prepareRide(m){
           const value=await db.$transaction(async tx=>{
           const order=await tx.order.create({data:{passengerId:m.passengerId,driverId:null,dispatchDriverId:m.profileId,dispatchExpiresAt:new Date(Date.now()+120000),cityId:m.cityId,status:'SEARCHING_DRIVER',mode:'CITY',requestType:'CITY_FIXED',currency:'RUB',price:100,commissionAmount:m.commissionRub,fromLat:56.8,fromLng:60.6,toLat:56.81,toLng:60.61,fromAddress:'VTB sandbox QA A',toAddress:'VTB sandbox QA B',paymentMethod:'CARD'}});
           m.orderIds.push(order.id);fs.writeFileSync(file,JSON.stringify(m),{mode:0o600});return order;});
           for(let i=0;i<20;i++)await vtb.processPayment('CITY:'+value.id);
           assert.equal(await db.tripCardPayment.count({where:{id:'CITY:'+value.id}}),0);
           await drivers.acceptOrder(m.driverId,value.id);
           let payment;
           for(let i=0;i<15;i++){payment=await vtb.checkout(m.passengerId,'CITY',value.id);if(payment.paymentUrl)break;await delay(1000);}
           assert(payment.paymentUrl);assert.equal(payment.bankAmount,700);return{orderId:value.id,paymentUrl:payment.paymentUrl,bankAmount:700};
          }
          (async()=>{
           assert.equal(process.env.VTB_SANDBOX_ENABLED,'true');assert.equal(fs.existsSync(file),false);
           const minimum=await db.appSettings.findUnique({where:{key:'driverMinOnlineBalanceRub'}});const baselineRub=Math.max(100,Number(minimum?.value)||100);
           const rate=await db.appSettings.findUnique({where:{key:'orderCommissionPercent'}});const percent=Number(rate?.value||10);assert(percent>=0&&percent<=100);
           const m=await db.$transaction(async tx=>{
           const city=await tx.city.create({data:{name:'VTB trip live QA '+run,countryCode:'RU',lat:56.8,lng:60.6,isActive:false}});
           const make=role=>tx.user.create({data:{phone:'vtb-trip-live:'+randomUUID(),name:'VTB trip live QA '+run,password:'unused-no-login-'+randomUUID(),role,cityId:city.id,refCode:randomUUID(),refLink:'',wallet:{create:{}}}});
           const passenger=await make('PASSENGER'),driver=await make('DRIVER');const profile=await tx.driverProfile.create({data:{userId:driver.id,status:'APPROVED',acceptCityFixed:true}});
           await tx.wallet.update({where:{userId:driver.id},data:{moneyRub:baselineRub}});
           const value={baselineRub,cityId:city.id,passengerId:passenger.id,driverId:driver.id,profileId:profile.id,commissionRub:Math.round(percent*100)/100,orderIds:[]};
           fs.writeFileSync(file,JSON.stringify(value),{mode:0o600,flag:'wx'});return value;});
           const meta=await prepareRide(m);console.log(JSON.stringify(meta));
          })().catch(e=>{console.error('VTB live trip creation: '+e.message);process.exitCode=1;}).finally(()=>db.$disconnect());
          JS
          REMOTE
      - name: Pay real sandbox trip in bank form
        run: |
          npm install --prefix "$RUNNER_TEMP/vtb-trip-browser" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.56.1
          export BANK_BROWSER_MODULE="$RUNNER_TEMP/vtb-trip-browser/node_modules/playwright"
          export BANK_BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{chromium}=require(process.env.BANK_BROWSER_MODULE);
          (async()=>{const meta=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/trip-probe.json','utf8'));assert.equal(new URL(meta.paymentUrl).hostname,'vtbkz.rbsuat.com');
          const b=await chromium.launch({headless:true,executablePath:process.env.BANK_BROWSER_BIN,args:['--no-sandbox']});
          try{const p=await b.newPage({locale:'ru-RU',viewport:{width:1280,height:900}});await p.route('**/flutter_bootstrap.js',r=>r.abort());
          await p.goto('https://intercity.89-207-255-27.sslip.io/',{waitUntil:'domcontentloaded'});await p.setContent('<iframe id="bank-frame" style="width:100%;height:850px;border:0"></iframe>');
          await p.locator('#bank-frame').evaluate((e,url)=>{e.src=url;},meta.paymentUrl);
          let frame=await(await p.locator('#bank-frame').elementHandle()).contentFrame(),embedded=true;
          try{await frame.locator('#new-card-pan').waitFor({state:'visible',timeout:20000});}
          catch{embedded=false;await p.goto(meta.paymentUrl,{waitUntil:'domcontentloaded'});frame=p.mainFrame();await frame.locator('#new-card-pan').waitFor({state:'visible',timeout:30000});}
          const text=await frame.locator('body').innerText();assert.match(text,/700(?:[.,]00)?/);assert.match(text,/KZT|₸|тенге/i);
          await frame.locator('#new-card-pan').fill('2201382000000062');await frame.locator('#newCardExpiry').fill('12/34');await frame.locator('#newCardCvc').fill('123');
          await frame.getByRole('button',{name:'Оплатить',exact:true}).first().click();await frame.waitForURL(u=>u.hostname==='intercity.89-207-255-27.sslip.io'||u.hostname==='api.intercity.89-207-255-27.sslip.io',{timeout:60000});
          console.log(JSON.stringify({realSandboxTripCardFormPaid:true,amountKzt:700,bankFormEmbedded:embedded}));
          }finally{await b.close();}})().catch(e=>{console.error(e.message);process.exitCode=1;});
          JS
      - name: Verify acceptance timing and atomic net driver settlement
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s -- "$GITHUB_RUN_ID"  <<'REMOTE'
