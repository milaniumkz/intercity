          const realtime={publish(){}},push={sendToUser:async()=>{},sendOrderStatusToPassenger:async()=>{}};
          const vtb=new VtbTripPaymentsService(db,realtime),cards=new CardPaymentsService(db,realtime,push,vtb),orders=new OrdersService(db,{}, {},realtime,push,cards);
          const drivers=new DriverService(db,{},realtime,push,{},null,undefined,undefined,cards);
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          async function prepareRide(m){
           const value=await db.$transaction(async tx=>{
           const order=await tx.order.create({data:{passengerId:m.passengerId,driverId:null,dispatchDriverId:m.profileId,dispatchExpiresAt:new Date(Date.now()+120000),cityId:m.cityId,status:'SEARCHING_DRIVER',mode:'CITY',requestType:'CITY_FIXED',currency:'RUB',price:100,commissionAmount:m.commissionRub,fromLat:56.8,fromLng:60.6,toLat:56.81,toLng:60.61,fromAddress:'VTB sandbox QA A',toAddress:'VTB sandbox QA B',paymentMethod:'CARD'}});
           m.orderIds.push(order.id);fs.writeFileSync(file,JSON.stringify(m),{mode:0o600});return order;});
           for(let i=0;i<20;i++)await vtb.processPayment('CITY:'+value.id);
           assert.equal(await db.tripCardPayment.count({where:{id:'CITY:'+value.id}}),0);
           await drivers.acceptOrder(m.driverId,value.id);
           let payment;
           for(let i=0;i<15;i++){payment=await vtb.checkout(m.passengerId,'CITY',value.id);if(payment.paymentUrl)break;await delay(1000);}
           assert(payment.paymentUrl);assert.equal(payment.bankAmount,700);return{orderId:value.id,paymentUrl:payment.paymentUrl,bankAmount:700};
          }
          (async()=>{
           const m=JSON.parse(fs.readFileSync(file,'utf8')),orderId=m.orderIds[0],id='CITY:'+orderId;
           for(let i=0;i<90;i++){const p=await db.tripCardPayment.findUnique({where:{id}});if(p?.status==='PAID')break;await delay(1000);}
           const p=await db.tripCardPayment.findUniqueOrThrow({where:{id}});assert.equal(p.status,'PAID');assert.equal(p.earningsCredited,false);
           const status=await vtb.gateway.status(p.bankOrderId);assert.equal(vtbTripBankState(status,p.bankOrderNumber,p.bankAmountMinor),'PAID');
           assert.equal((await db.wallet.findUnique({where:{userId:m.driverId}})).moneyRub,m.baselineRub);
           await orders.updateOrderStatus(orderId,'DRIVER_ARRIVED',{userId:m.driverId,role:'DRIVER'});
           await orders.updateOrderStatus(orderId,'IN_PROGRESS',{userId:m.driverId,role:'DRIVER'});
           assert.equal((await db.wallet.findUnique({where:{userId:m.driverId}})).moneyRub,m.baselineRub);
           await orders.updateOrderStatus(orderId,'COMPLETED',{userId:m.driverId,role:'DRIVER'});
           for(let i=0;i<20;i++)await orders.updateOrderStatus(orderId,'COMPLETED',{userId:m.driverId,role:'DRIVER'});
           const callback='http://127.0.0.1:'+(process.env.PORT||3000)+'/api/payments/vtb/trips/callback';
           const replies=await Promise.all(Array.from({length:20},()=>fetch(callback,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({orderId:p.bankOrderId,status:'PAID',amount:1})})));
           assert(replies.every(r=>r.status===200));
           const wallet=await db.wallet.findUniqueOrThrow({where:{userId:m.driverId}});assert.equal(wallet.moneyRub,m.baselineRub+100-m.commissionRub);assert.equal(wallet.money,0);assert.equal(wallet.bonusRub,0);
           assert.equal(await db.walletTransaction.count({where:{orderId,type:'CARD_RIDE_EARNINGS'}}),1);
           assert.equal((await db.tripCardPayment.findUnique({where:{id}})).status,'SETTLED');
           console.log(JSON.stringify({realVtbPassengerTripVerified:true,fareRub:100,bankPaidKzt:700,commissionRub:m.commissionRub,driverNetRub:wallet.moneyRub-m.baselineRub,balanceBeforeRub:m.baselineRub,balanceAfterRub:wallet.moneyRub,paymentStartedOnlyAfterDriverAcceptance:true,creditedOnlyAfterCompletion:true,backgroundPaymentVerification:true,repeatedCompletions:20,repeatedPublicCallbacks:20,earningsLedgerEntries:1,productionBankEnabled:false}));
          })().catch(e=>{console.error('VTB live settlement: '+e.message);process.exitCode=1;}).finally(()=>db.$disconnect());
