          const attempt=await db.cardPaymentAttempt.findUniqueOrThrow({where:{id:m.lateAttemptId}});assert.equal(attempt.status,'REFUNDED');assert.equal(attempt.watchBank,false);
          const bank=await vtb.gateway.status(attempt.providerId);assert.equal(vtbTripBankState(bank,attempt.merchantOrderNumber,attempt.bankAmountMinor),'REFUNDED');
          assert.equal((await db.tripCardPayment.findUnique({where:{id:'CITY:'+m.cashTripId}})).status,'CASH');
          assert.equal((await db.wallet.findUnique({where:{userId:m.driverId}})).moneyRub,m.balanceBeforeLatePay);
          await Promise.all(Array.from({length:20},()=>vtb.processAttemptWatch(attempt.id)));
          console.log(JSON.stringify({realLatePaymentAfterCashRefunded:true,refundedKzt:700,tripCompleted:true,tripRemainsCash:true,driverBalanceUnchanged:true,repeatedLateRefundChecks:20}));
          })().catch(e=>{console.error('VTB late cash refund: '+e.message);process.exitCode=1;}).finally(()=>db.$disconnect());
