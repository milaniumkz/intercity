      - name: Refund sandbox charges and remove temporary accounts
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s -- "$GITHUB_RUN_ID"  <<'REMOTE'
          set -euo pipefail
          docker exec -i -e VTB_TRIP_PROBE_RUN="$1" intercity-backend node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),{randomUUID}=require('node:crypto');
          const {PrismaClient}=require('@prisma/client');
          const {VtbTripPaymentsService,vtbTripBankState}=require('./dist/src/payments/vtb-trip-payments.service');
          const {CardPaymentsService}=require('./dist/src/payments/card-payments.service');
          const {OrdersService}=require('./dist/src/orders/orders.service');
          const {DriverService}=require('./dist/src/driver/driver.service');
          const db=new PrismaClient(),run=process.env.VTB_TRIP_PROBE_RUN;
          assert.match(run,/^[0-9]+$/);
          const file=path.join(process.env.TECH_STORAGE_DIR||'/app/technical-data','vtb-trip-live-'+run+'.json');
          const realtime={publish(){}},push={sendToUser:async()=>{},sendOrderStatusToPassenger:async()=>{}};
          const vtb=new VtbTripPaymentsService(db,realtime),cards=new CardPaymentsService(db,realtime,push,vtb),orders=new OrdersService(db,{}, {},realtime,push,cards);
          const drivers=new DriverService(db,{},realtime,push,{},null,undefined,undefined,cards);
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          async function prepareRide(m){
           const value=await db.$transaction(async tx=>{
           const order=await tx.order.create({data:{passengerId:m.passengerId,driverId:null,dispatchDriverId:m.profileId,dispatchExpiresAt:new Date(Date.now()+120000),cityId:m.cityId,status:'SEARCHING_DRIVER',mode:'CITY',requestType:'CITY_FIXED',currency:'RUB',price:100,commissionAmount:m.commissionRub,fromLat:56.8,fromLng:60.6,toLat:56.81,toLng:60.61,fromAddress:'VTB sandbox QA A',toAddress:'VTB sandbox QA B',paymentMethod:'CARD'}});
           m.orderIds.push(order.id);fs.writeFileSync(file,JSON.stringify(m),{mode:0o600});return order;});
           for(let i=0;i<20;i++)await vtb.processPayment('CITY:'+value.id);
           assert.equal(await db.tripCardPayment.count({where:{id:'CITY:'+value.id}}),0);
           await drivers.acceptOrder(m.driverId,value.id);
           let payment;
           for(let i=0;i<15;i++){payment=await vtb.checkout(m.passengerId,'CITY',value.id);if(payment.paymentUrl)break;await delay(1000);}
           assert(payment.paymentUrl);assert.equal(payment.bankAmount,700);return{orderId:value.id,paymentUrl:payment.paymentUrl,bankAmount:700};
          }
          (async()=>{
           if(!fs.existsSync(file)){console.log(JSON.stringify({tripFixtureCleanup:true,fixtureNotCreated:true}));return;}
           const m=JSON.parse(fs.readFileSync(file,'utf8')),userIds=[m.passengerId,m.driverId];
           const users=await db.user.findMany({where:{id:{in:userIds}},select:{phone:true}});assert(users.every(u=>u.phone.startsWith('vtb-trip-live:')));
           const payments=await db.tripCardPayment.findMany({where:{passengerId:m.passengerId}});
           for(const p of payments){
            if(!p.bankOrderId)continue;
            let bank=await vtb.gateway.status(p.bankOrderId),state=vtbTripBankState(bank,p.bankOrderNumber,p.bankAmountMinor);
            if(state==='PAID'){await vtb.gateway.refund(p.bankOrderId,p.bankAmountMinor,p.bankOrderNumber);bank=await vtb.gateway.status(p.bankOrderId);state=vtbTripBankState(bank,p.bankOrderNumber,p.bankAmountMinor);assert.equal(state,'REFUNDED');}
            if(['PENDING','DECLINED'].includes(state)){
             await db.cardPaymentAttempt.upsert({where:{id:p.id+':'+p.attempts},update:{watchBank:true,bankAmountMinor:p.bankAmountMinor,paymentUrl:null,nextCheckAt:new Date()},create:{id:p.id+':'+p.attempts,paymentId:p.id,number:p.attempts,providerId:p.bankOrderId,merchantOrderNumber:p.bankOrderNumber,bankAmountMinor:p.bankAmountMinor,status:'CANCELLED_OPEN',watchBank:true}});
            }else if(['REFUNDED','REVERSED','FAILED'].includes(state)){
             await db.cardPaymentAttempt.updateMany({where:{paymentId:p.id,providerId:p.bankOrderId},data:{watchBank:false}});
            }else throw Error('Unverified sandbox cleanup payment');
           }
           const retained=await db.$transaction(async tx=>{
           const ids=payments.map(p=>p.id);
           await tx.cardPaymentAttempt.deleteMany({where:{paymentId:{in:ids},watchBank:false}});
           const watched=await tx.cardPaymentAttempt.updateMany({where:{paymentId:{in:ids},watchBank:true},data:{paymentUrl:null}});
           await tx.tripCardPayment.deleteMany({where:{passengerId:m.passengerId}});
           await tx.walletTransaction.deleteMany({where:{wallet:{userId:{in:userIds}}}});
           await tx.taxIncomeEntry.deleteMany({where:{sourceId:{in:m.orderIds}}});
           await tx.tripVerification.deleteMany({where:{passengerId:m.passengerId}});
           await tx.rideEvent.deleteMany({where:{orderId:{in:m.orderIds}}});
           await tx.order.deleteMany({where:{id:{in:m.orderIds}}});
           await tx.savedPaymentCard.deleteMany({where:{userId:m.passengerId}});await tx.cardBinding.deleteMany({where:{userId:m.passengerId}});
           await tx.driverDailyParticipation.deleteMany({where:{driverId:m.profileId}});
           await tx.driverActivityEvent.deleteMany({where:{driverId:m.profileId}});
           await tx.driverServiceStats.deleteMany({where:{driverId:m.profileId}});
           await tx.driverProfile.deleteMany({where:{id:m.profileId}});
           await tx.wallet.deleteMany({where:{userId:{in:userIds}}});
           await tx.user.deleteMany({where:{id:{in:userIds}}});await tx.city.deleteMany({where:{id:m.cityId}});
           return watched.count;
           });
           fs.unlinkSync(file);
           console.log(JSON.stringify({tripFixtureCleanup:true,temporaryAccountsOrdersAndWalletsRemoved:true,capturedSandboxChargesRefunded:true,anonymousOldFormWatchesRetained:retained}));
          })().catch(e=>{console.error('VTB fixture cleanup: '+e.message);process.exitCode=1;}).finally(()=>db.$disconnect());
