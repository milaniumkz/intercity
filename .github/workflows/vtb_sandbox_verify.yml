name: Verify VTB sandbox wallet credits
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/configure_vtb_sandbox.py'
      - 'scripts/tests/test_vtb_sandbox_config.py'
      - '.github/workflows/vtb_sandbox_verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: vtb_sandbox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify sandbox payments against isolated PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql://qa:isolated_test_only@127.0.0.1:5432/vtb_sandbox_test
          VTB_SANDBOX_TEST_DATABASE_URL: postgresql://qa:isolated_test_only@127.0.0.1:5432/vtb_sandbox_test
        run: |
          python3 -m unittest discover -s ../scripts/tests -p test_vtb_sandbox_config.py
          npm ci
          npx prisma generate
          npx prisma db push --skip-generate
          npm run build
          node --test test/vtb-sandbox-gateway.test.js test/vtb-sandbox-service.test.js test/vtb-sandbox-credit.test.js
