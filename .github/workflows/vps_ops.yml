name: VPS Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operation
        required: true
        type: choice
        options:
          - status
          - publish-bundle
          - enable-kz-tax-accounting
          - enable-demo-topups
          - seed-city-tariffs
          - logs
          - restart
          - redeploy-current
          - rollback
      target:
        description: Service for logs or release commit for rollback
        required: false

concurrency:
  group: ${{ inputs.action == 'status' && 'intercity-production-vps-readonly' || 'intercity-production-vps-ops' }}
  cancel-in-progress: false

jobs:
  ops:
    name: Run VPS operation
    if: inputs.action != 'publish-bundle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check notification credential readiness
        if: inputs.action == 'status' && inputs.target == 'notifications'
        env:
          WEB_VAPID: ${{ secrets.INTERCITY_FIREBASE_WEB_VAPID_KEY }}
          FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node <<'JS'
          const crypto = require('node:crypto');
          let vapidValid = false, accountValid = false;
          try {
            const key = Buffer.from((process.env.WEB_VAPID || '').trim(), 'base64url');
            crypto.ECDH.convertKey(key, 'prime256v1');
            vapidValid = key.length === 65 && key[0] === 4;
          } catch (_) {}
          try {
            const account = JSON.parse(process.env.FIREBASE_ACCOUNT || '');
            accountValid = account.project_id === 'inter-city-pkzpps' && !!account.client_email && !!account.private_key;
          } catch (_) {}
          console.log(JSON.stringify({webVapidPresent:!!process.env.WEB_VAPID,webVapidValid:vapidValid,firebaseAccountPresent:!!process.env.FIREBASE_ACCOUNT,firebaseAccountValid:accountValid}));
          JS
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_PRIVATE_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Run operation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
        run: |
          scp scripts/vps_ops.sh "$VPS_USER@$VPS_HOST:/tmp/vps_ops.sh"
          if [[ "$ACTION" == "seed-city-tariffs" ]]; then
            scp backend/scripts/seed-all-city-tariffs.cjs "$VPS_USER@$VPS_HOST:/tmp/seed-all-city-tariffs.cjs"
          fi
          ssh "$VPS_USER@$VPS_HOST" "bash /tmp/vps_ops.sh '$ACTION' '$TARGET'"

  publish:
    name: Publish verified release with resumable transfer
    if: inputs.action == 'publish-bundle'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
    concurrency:
      group: intercity-production-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Resolve verified build artifact
        env:
          TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TARGET" =~ ^([a-f0-9]{40}):([0-9]+)$ ]] || exit 1
          sha="${BASH_REMATCH[1]}"
          run_id="${BASH_REMATCH[2]}"
          echo "DEPLOY_SHA=$sha" >> "$GITHUB_ENV"
          echo "BUILD_RUN_ID=$run_id" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" > "$RUNNER_TEMP/artifacts.json"
          python3 - "$RUNNER_TEMP/artifacts.json" "$sha" >> "$GITHUB_ENV" <<'PYRESOLVE'
          import json, re, sys
          artifacts = json.load(open(sys.argv[1]))['artifacts']
          matches = [a for a in artifacts if a['name'] == 'intercity-vps-' + sys.argv[2] and not a['expired'] and a['workflow_run']['head_sha'] == sys.argv[2]]
          assert len(matches) == 1, 'Expected one artifact from the exact release build'
          item = matches[0]
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', item['digest']), 'Missing artifact checksum'
          print('ARTIFACT_ID=' + str(item['id']))
          print('ARTIFACT_DIGEST=' + item['digest'])
          PYRESOLVE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: output
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_PRIVATE_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Transfer, verify and publish
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          YANDEX_GEOCODER_API_KEY: ${{ secrets.YANDEX_GEOCODER_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 scripts/vps_transfer_bundle.py "output/intercity-vps-$DEPLOY_SHA.tar.gz" "$DEPLOY_SHA"
          scp scripts/vps_deploy_release.sh "$VPS_USER@$VPS_HOST:/tmp/"
          python3 - <<'PYTRANSFER' | ssh "$VPS_USER@$VPS_HOST" "umask 077; cat > /tmp/intercity-yandex-$DEPLOY_SHA.json; bash /tmp/vps_deploy_release.sh /tmp/intercity-vps-$DEPLOY_SHA.tar.gz '$DEPLOY_SHA' /tmp/intercity-yandex-$DEPLOY_SHA.json"
          import json, os, sys
          json.dump({'key':os.environ.get('YANDEX_GEOCODER_API_KEY',''),'firebase':os.environ.get('FIREBASE_SERVICE_ACCOUNT_JSON','')},sys.stdout)
          PYTRANSFER
