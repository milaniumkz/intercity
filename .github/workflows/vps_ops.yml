name: VPS Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operation
        required: true
        type: choice
        options:
          - status
          - logs
          - restart
          - redeploy-current
          - rollback
          - repair-kirovsk-country
      target:
        description: Service for logs or release commit for rollback
        required: false

concurrency:
  group: intercity-production-vps-ops
  cancel-in-progress: false

jobs:
  ops:
    name: Run VPS operation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_PRIVATE_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Check geocoder credential presence
        env:
          YANDEX_GEOCODER_API_KEY: ${{ secrets.YANDEX_GEOCODER_API_KEY }}
        run: |
          if [[ -n "$YANDEX_GEOCODER_API_KEY" ]]; then echo "Actions geocoder key configured"; else echo "Actions geocoder key missing"; fi
      - name: Run operation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
        run: |
          if [[ "$TARGET" == "audit-geo-catalog" ]]; then
            scp scripts/audit_geo_catalog.js "$VPS_USER@$VPS_HOST:/tmp/intercity-audit-geo-catalog.js"
          fi
          scp scripts/vps_ops.sh "$VPS_USER@$VPS_HOST:/tmp/vps_ops.sh"
          ssh "$VPS_USER@$VPS_HOST" "bash /tmp/vps_ops.sh '$ACTION' '$TARGET'"
