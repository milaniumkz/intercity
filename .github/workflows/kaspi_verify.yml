name: Verify Kaspi driver FIO
on:
  pull_request:
    paths:
      - 'backend/src/wallet/kaspi*.ts'
      - 'backend/test/kaspi.test.js'
      - 'backend/scripts/provision-kaspi-test.cjs'
      - '.github/workflows/kaspi_verify.yml'
permissions:
  contents: read
jobs:
  kaspi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: dispatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify required FIO and unchanged financial guarantees
        working-directory: backend
        env:
          DATABASE_URL: postgresql://qa:isolated_test_only@127.0.0.1:5432/dispatch_test
          DISPATCH_TEST_DATABASE_URL: postgresql://qa:isolated_test_only@127.0.0.1:5432/dispatch_test
        run: |
          npm ci
          npx prisma generate
          npx prisma db push --skip-generate
          npm run build
          node --test test/kaspi.test.js
