name: Probe Kassa24 demo payouts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kassa24_payout_probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_PRIVATE_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
      - name: Compare private credential bindings and test authorization without creating transactions
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          umask 077
          host_file="/tmp/intercity-kassa-auth-$1.json"
          cleanup() { rm -f "$host_file"; docker exec -u 0 intercity-backend rm -f /tmp/intercity-kassa-auth-host.json || true; }
          trap cleanup EXIT
          python3 - /opt/intercity/shared/.env > "$host_file" <<'PY'
          import sys,json
          values={};counts={}
          for line in open(sys.argv[1]):
              if '=' not in line or line.lstrip().startswith('#'):continue
              key,value=line.rstrip('\n').split('=',1);key=key.strip()
              if key not in ['KASSA24_LOGIN','KASSA24_MERCHANT_ID','KASSA24_PASSWORD']:continue
              counts[key]=counts.get(key,0)+1;value=value.strip()
              if len(value)>=2 and value[0]==value[-1] and value[0] in ['"',"'"]:value=value[1:-1]
              values[key]=value
          values['_duplicates']=[key for key,count in counts.items() if count>1]
          print(json.dumps(values))
          PY
          docker exec -i intercity-backend sh -c 'umask 077; cat > /tmp/intercity-kassa-auth-host.json' < "$host_file"
          docker exec -i intercity-backend node <<'JS'
          const fs=require('node:fs'),{randomUUID}=require('node:crypto');
          (async()=>{
           const host=JSON.parse(fs.readFileSync('/tmp/intercity-kassa-auth-host.json','utf8')),base=process.env.KASSA24_API_URL||'https://ecommerce.pult24.kz';
           const url=new URL('/payment/status?orderid=auth-check-'+randomUUID(),base);
           if(url.protocol!=='https:'||url.hostname!=='ecommerce.pult24.kz')throw Error('Unexpected gateway');
           const mainLogin=process.env.KASSA24_LOGIN||process.env.KASSA24_MERCHANT_ID||'',mainPass=process.env.KASSA24_PASSWORD||'';
           console.log(JSON.stringify({kassaAuthBindingDiagnostics:true,hostPasswordMatchesContainer:host.KASSA24_PASSWORD===mainPass,hostLoginMatchesContainer:host.KASSA24_LOGIN===(process.env.KASSA24_LOGIN||''),loginMatchesMerchantId:process.env.KASSA24_LOGIN===process.env.KASSA24_MERCHANT_ID,loginHasWhitespace:/\s/.test(mainLogin),passwordHasOuterWhitespace:mainPass.trim()!==mainPass,passwordLooksPlaceholder:/^(change.?me|your.?password|password|replace.?me|secret)$/i.test(mainPass),sharedEnvDuplicateKeys:host._duplicates}));
           const options=[['container-login',mainLogin,mainPass],['container-merchant-id',process.env.KASSA24_MERCHANT_ID||'',mainPass],['shared-literal-login',host.KASSA24_LOGIN||host.KASSA24_MERCHANT_ID||'',host.KASSA24_PASSWORD||''],['shared-literal-merchant-id',host.KASSA24_MERCHANT_ID||'',host.KASSA24_PASSWORD||'']];
           const seen=new Set();
           for(const [binding,login,password]of options){if(!login||!password)continue;const key=JSON.stringify([login,password]);if(seen.has(key))continue;seen.add(key);
            const r=await fetch(url,{headers:{Authorization:'Basic '+Buffer.from(login+':'+password).toString('base64')},signal:AbortSignal.timeout(10000)}),d=await r.json().catch(()=>({})),e=d.error;
            const msg=String(typeof e==='string'?e:e?.message||d.message||d.errMessage||'');
            console.log(JSON.stringify({binding,httpStatus:r.status,errorType:typeof e,errorKeys:e&&typeof e==='object'?Object.keys(e):[],authorizationRejected:/unauthoriz|invalid.*(login|password|credential)|авторизац|логин|парол/i.test(msg),merchantBlocked:/merchant.*block|заблокиров|мерчант.*откл/i.test(msg),ipRestricted:/ip.*(denied|allow|restrict)|ip.*огранич/i.test(msg),responseKeys:Object.keys(d).filter(k=>!/(card|token|password|phone|email)/i.test(k))}));
           }
          })().catch(e=>{console.error('Kassa24 authorization diagnostics failed: '+e.message);process.exitCode=1;});
          JS
          REMOTE
