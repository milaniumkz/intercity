name: Probe Kassa24 demo payouts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kassa24_payout_probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_PRIVATE_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
      - name: Inspect gateway and create only a demo payout without wallet changes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          docker exec -i -e PAYOUT_PROBE_RUN="$1" intercity-backend node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),{randomUUID}=require('node:crypto');
          (async()=>{
           const base=process.env.KASSA24_API_URL||'https://ecommerce.pult24.kz',login=process.env.KASSA24_LOGIN||process.env.KASSA24_MERCHANT_ID||'',password=process.env.KASSA24_PASSWORD||'';
           const parsed=new URL(base);console.log(JSON.stringify({kassa24PayoutConfiguration:true,host:parsed.hostname,loginConfigured:!!login,passwordConfigured:!!password,applicationDemoFlag:process.env.KASSA24_DEMO==='true',release:process.env.RELEASE_SHA}));
           if(!login||!password)return;
           if(parsed.protocol!=='https:'||!['ecommerce.pult24.kz'].includes(parsed.hostname))throw Error('Unrecognized payout gateway host; no bank request sent');
           const orderId='intercity-payout-probe-'+randomUUID(),auth='Basic '+Buffer.from(login+':'+password).toString('base64');
           const r=await fetch(new URL('/payment/create',base),{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify({merchantId:login,orderId,type:1,amount:100,currency:'KZT',demo:true,description:'InterCity isolated DEMO payout verification',customerData:{phone:'70000000001'}}),signal:AbortSignal.timeout(15000)});
           const data=await r.json().catch(()=>({})),message=String(data.errMessage||data.message||data.error?.message||data.error||'');
           const code=data.errCode??data.code??data.errorCode??null;
           console.log(JSON.stringify({demoPayoutCreateHttpStatus:r.status,providerErrorCode:typeof code==='number'||typeof code==='string'?code:null,merchantBlocked:/merchant.{0,40}block|заблокирован/i.test(message),insufficientFunds:/insufficient|недостаточно/i.test(message),permissionDenied:/permission|not allowed|доступ.*запре|разрешен/i.test(message),responseKeys:Object.keys(data).filter(k=>!/(card|token|password|phone|email)/i.test(k)),hasPaymentId:!!data.id,hasHostedUrl:!!data.url,noRealPayoutRequested:true}));
           if(r.ok&&data.id&&data.url){
            const statusResponse=await fetch(new URL('/payment/status?orderid='+encodeURIComponent(orderId),base),{headers:{Authorization:auth},signal:AbortSignal.timeout(15000)});
            const status=await statusResponse.json().catch(()=>({}));
            console.log(JSON.stringify({demoPayoutStatusHttp:statusResponse.status,statusKeys:Object.keys(status).filter(k=>!/(card|token|password|phone|email)/i.test(k)),status:status.status,errCode:status.errCode,demo:status.demo,isDemo:status.isDemo,amount:status.amount,type:status.type,paymentType:status.paymentType,orderMatches:String(status.orderId||status.orderID)===orderId,merchantMatches:status.merchantId==null?null:String(status.merchantId)===login}));
            const root=process.env.TECH_STORAGE_DIR||'/app/technical-data';const manifest={orderId,id:String(data.id),url:String(data.url),createdAt:new Date().toISOString(),demo:true};
            fs.writeFileSync(path.join(root,'kassa24-payout-probe-'+process.env.PAYOUT_PROBE_RUN+'.json'),JSON.stringify(manifest),{mode:0o600,flag:'wx'});
           }
          })().catch(e=>{console.error('Kassa24 demo payout probe failed: '+e.message);process.exitCode=1;});
          JS
          REMOTE
