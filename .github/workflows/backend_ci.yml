---
name: Backend CI
jobs:
  backend:
    name: Build backend
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["milanium-mac-arm64",
      "repo-intercity"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      if: github.event_name == 'pull_request'
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: backend/package-lock.json
    - name: Select installed Mac Node 20
      if: github.event_name != 'pull_request'
      run: echo /opt/homebrew/opt/node@20/bin >> "$GITHUB_PATH"
    - name: Install and build
      working-directory: backend
      run: |
        unset CURRENCY_TEST_DATABASE_URL
        export DATABASE_URL= REDIS_URL=
        npm ci
        npx prisma generate
        npm run build
        node --test test/*.test.js
'on':
  pull_request:
    paths:
    - ".github/workflows/backend_ci.yml"
    - backend/**
    - infra/**
    - scripts/**
  push:
    branches:
    - main
    - master
    paths:
    - ".github/workflows/backend_ci.yml"
    - backend/**
    - infra/**
    - scripts/**
