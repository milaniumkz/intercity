name: Diagnose identity verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/identity_diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_PRIVATE_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
      - name: Read only identity failure diagnostics
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          docker exec -i intercity-backend node <<'JS'
          const {PrismaClient}=require('@prisma/client'),{createHash}=require('node:crypto'),fs=require('node:fs/promises');
          const {IdentityVault}=require('./dist/src/identity/identity-vault'),{IdentityEngine}=require('./dist/src/identity/identity-engine');
          const db=new PrismaClient(),targets=["9fce3a994d1c38eb1e160ac0b9575b35d586ab5cecc595ac8fa5777e68d89c3f","1aef9bfc9fa377c98d06ee5eeb203bf37f8bd1e6e7d0ab1b6d1665918fd1fff5"];
          (async()=>{const users=await db.user.findMany({where:{phone:{not:{startsWith:'erased:'}}},select:{id:true,phone:true,role:true,blockedAt:true,authVersion:true,createdAt:true,biometricProfile:{select:{status:true,enrolledAt:true,model:true}},driverProfile:{select:{status:true}}}});
          const selected=users.filter(u=>targets.includes(createHash('sha256').update('identity-support-20261127:'+u.phone.replace(/\D/g,'').slice(-10)).digest('hex')));
          console.log(JSON.stringify({identitySupportAccountsFound:selected.length,release:process.env.RELEASE_SHA||process.env.INTERCITY_RELEASE_SHA||null}));
          const vault=new IdentityVault();await fs.access(vault.root+'/key.bin');await vault.init();const engine=new IdentityEngine();
          for(const u of selected){const attempts=await db.biometricChallenge.findMany({where:{userId:u.id,purpose:{in:['ENROLL','RECOVERY']}},orderBy:{createdAt:'desc'},take:12,select:{purpose:true,status:true,actions:true,reason:true,videoPath:true,createdAt:true,claimedAt:true,consentVersion:true}});
          console.log(JSON.stringify({account:'***'+u.phone.slice(-4),role:u.role,blocked:!!u.blockedAt,profile:u.biometricProfile,driverStatus:u.driverProfile?.status,attempts:attempts.map(({videoPath,...a})=>({...a,videoAvailable:!!videoPath}))}));
          const c=attempts.find(a=>a.videoPath&&['FAILED','REJECTED','REVIEW'].includes(a.status));
          if(c){try{const video=await vault.read(u.id,c.videoPath);const t=Date.now(),r=await engine.verify(video,c.actions);console.log(JSON.stringify({account:'***'+u.phone.slice(-4),reprocessedAttempt:c.createdAt,bytes:video.length,elapsedSeconds:Math.round((Date.now()-t)/1000),verdict:r.verdict,reason:r.reason,checks:r.checks}));}catch(e){console.log(JSON.stringify({account:'***'+u.phone.slice(-4),reprocessingUnavailable:true,error:e.message?.slice(0,200)}));}}
          }
          const summary=await db.biometricChallenge.groupBy({by:['status','purpose','reason'],where:{createdAt:{gte:new Date(Date.now()-3*86400000)},purpose:{in:['ENROLL','RECOVERY']}},_count:{_all:true}});console.log(JSON.stringify({recentIdentityCounts:summary.map(x=>({status:x.status,purpose:x.purpose,reason:x.reason,count:x._count._all}))}));
          })().catch(e=>{console.error('Identity diagnostics failed: '+e.message);process.exitCode=1;}).finally(()=>db.$disconnect());
          JS
          REMOTE
