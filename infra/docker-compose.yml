version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: intercity-db
    environment:
      POSTGRES_USER: intercity
      POSTGRES_PASSWORD: intercity123
      POSTGRES_DB: intercity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intercity"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: intercity-backend
    environment:
      DATABASE_URL: postgresql://intercity:intercity123@postgres:5432/intercity
      JWT_SECRET: intercity_jwt_secret_key_change_in_production
      JWT_REFRESH_SECRET: intercity_refresh_secret_key_change_in_production
      PORT: 3000
      OSRM_URL: http://router.project-osrm.org
      NOMINATIM_URL: https://nominatim.openstreetmap.org
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
