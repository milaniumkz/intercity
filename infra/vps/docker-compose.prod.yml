services:
  postgres:
    image: postgres:15-alpine
    container_name: intercity-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: ../../services/identity
      dockerfile: Dockerfile
    image: intercity-identity:prod
    container_name: intercity-identity
    restart: unless-stopped
    mem_limit: 768m
    cpus: '1.5'
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=256m']
    networks: [identity_internal]
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health",timeout=3).read()']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  routing:
    build:
      context: ../../services/routing
    image: intercity-routing:prod
    container_name: intercity-routing
    restart: unless-stopped
    mem_limit: 640m
    cpus: '1.0'
    pids_limit: 96
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000']
    volumes:
      - ../../routing-data:/segments4:ro
    networks: [routing_internal]
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/17777']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  backend:
    networks: [default, identity_internal, routing_internal]
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: intercity-backend:prod
    container_name: intercity-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      routing:
        condition: service_healthy
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../../uploads:/app/uploads
      - ../../technical-data:/app/technical-data
    environment:
      BROUTER_URL: http://routing:17777
      IDENTITY_ENGINE_URL: http://identity:8080
      TECH_STORAGE_DIR: /app/technical-data
      TECH_TRUST_PROXY: "1"
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: intercity-caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/mobile:/srv/intercity/mobile:ro
      - ./web/admin:/srv/intercity/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  routing_internal:
    internal: true
  identity_internal:
    internal: true
