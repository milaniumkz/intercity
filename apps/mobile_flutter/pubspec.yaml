name: intercity_mobile
description: INTERCITY Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intercity_shared:
    path: ../../packages/intercity_shared

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^13.0.0

  # Networking
  dio: ^5.4.0
  url_launcher: ^6.3.1

  # Storage
  flutter_secure_storage:
    path: ../../packages/flutter_secure_storage_native
  firebase_core: ^3.15.1
  firebase_messaging: ^15.2.6
  flutter_local_notifications: ^17.2.2
  flutter_tts:
    path: ../../packages/flutter_tts_native
  web: ^1.1.1

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Location
  geolocator: ^14.0.1

  # Data Classes
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # UI
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/adaptive-icon.png
  adaptive_icon_foreground: assets/branding/adaptive-icon.png
  adaptive_icon_background: "#FFFFFF"
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/branding/adaptive-icon.png
    background_color: "#8B7ED0"
    theme_color: "#8B7ED0"
  macos:
    generate: true
    image_path: assets/branding/adaptive-icon.png

flutter_native_splash:
  color: "#090814"
  color_dark: "#090814"
  image: assets/branding/splash.jpg
  android: true
  ios: true
  web: true
  web_image_mode: cover
  android_12:
    color: "#090814"
    color_dark: "#090814"
    image: assets/branding/splash.jpg
    icon_background_color: "#090814"
    icon_background_color_dark: "#090814"
